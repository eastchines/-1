name: 构建 EXE
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: |
          pip install pyinstaller pillow pynput
      - name: 构建 exe
        run: |
          pyinstaller -w main.py --add-data "skin;skin" --hidden-import=PIL.Image --hidden-import=PIL.ImageTk
      - name: 上传工件
        uses: actions/upload-artifact@v4
        with:
          name: 桌面宠物
          path: dist/
